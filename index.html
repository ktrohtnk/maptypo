<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Letter Tracer | 道路文字ジェネレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@700&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=8.0" />
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="logo">
        <span class="logo-icon">🗺️</span>
        <span class="logo-text">ROAD TRACER <span class="version">v6.2 Generative</span></span>
      </div>
    </header>

    <div id="main-layout">
      <!-- Controls -->
      <aside id="sidebar-left">
        <div class="search-header" style="margin-bottom: 24px;">
          <p class="search-desc" style="margin: 0; line-height: 1.6;">
            <strong style="color: rgb(210, 0, 255);">Map Typography</strong> — Generative drawing engine using real road networks.
          </p>
        </div>

        <div class="search-card">
          <div class="filter-group location-group" style="position: relative;">
            <label class="filter-label">Location</label>
            <div class="input-wrap">
              <textarea id="address-input" placeholder="e.g. Fukuoka, Japan" rows="2" style="resize: vertical;" autocomplete="off">福岡市 薬院</textarea>
            </div>
            <ul id="location-suggestions" class="suggestions-list hidden"></ul>
          </div>

          <div class="filter-group">
            <label class="filter-label">Text</label>
            <div class="input-wrap">
              <textarea id="target-chars-input" placeholder="e.g. ARK&#10;CITY" rows="3" style="resize: vertical;">ROAD&#10;TRACER</textarea>
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label">Scale</label>
            <select id="size-select">
              <option value="200">Small (200m)</option>
              <option value="500" selected>Medium (500m)</option>
              <option value="1000">Large (1km)</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label">Text Color</label>
            <div style="display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.03); padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
              <input type="color" id="color-picker" value="#0000ff" style="flex: 1; height: 32px; padding: 0; border: none; cursor: pointer; background: transparent;">
              <label style="font-size: 0.85em; display: flex; align-items: center; gap: 4px; cursor: pointer; color: #555;">
                <input type="checkbox" id="random-color-checkbox" checked>
                Random Tone
              </label>
            </div>
          </div>

          <div class="btn-row">
            <button id="search-btn" class="primary-btn" onclick="startTrace()">
              <span id="search-btn-text">Generate</span>
              <span id="search-spinner" class="spinner hidden"></span>
            </button>
            <button id="clear-btn" class="secondary-btn" onclick="clearTrace()">Clear</button>
          </div>
          <button id="dl-btn" class="secondary-btn" style="width:100%; margin-top:8px;" onclick="downloadSVG()">⬇ Download SVG</button>
        </div>

        <div id="status-bar" class="hidden">
          <div id="status-text">Processing...</div>
          <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
        </div>
      </aside>

      <!-- Map Canvas -->
      <main id="map-area">
        <div id="map"></div>
        <div id="map-overlay" class="hidden"></div>
        <div id="matrix-overlay" class="hidden">
          <div class="matrix-line" id="matrix-lat"></div>
          <div class="matrix-line" id="matrix-lon"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA_ndOcrLr05o5HrLEJlCjgFAHpHxUuQiY&v=weekly" defer></script>
  <script src="matcher.js?v=8.0"></script>
  <script src="app.js?v=8.0"></script>
</body>
</html>
